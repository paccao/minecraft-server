---
services:
  mc:
    image: itzg/minecraft-server:stable-java21-alpine
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "MODRINTH"
      VERSION: "1.21.1"
      MODRINTH_MODPACK: /modpacks/create-adventure-SMP-1.2.mrpack
      MODS: |
        https://cdn.modrinth.com/data/XlUm5I57/versions/ZCRHabJE/icys-better-horses-2.0.0-1.21.1-neo.jar?mr_download_reason=standalone&mr_game_version=1.21.1&mr_loader=neoforge
      MEMORY: "20480M"
      MAX_MEMORY: "24576M"
      MAX_PLAYERS: "10"
      MOTD: "§6gaming"
      ONLINE_MODE: "false"
      USE_MEOWICE_FLAGS: "true"
      TZ: "Europe/Stockholm"
      DIFFICULTY: "2"
      SIMULATION_DISTANCE: "11"
      VIEW_DISTANCE: "12"
      LEVEL: "pacpack"
      WORLD: "/backups/pacpack_2026-09-20_03-11-22.zip"
      SPAWN_PROTECTION: "0"
      RATE_LIMIT: "0"
      ENFORCE_SECURE_PROFILE: "false"
      STATUS_HEARTBEAT_INTERVAL: "60000"
      ALLOW_FLIGHT: "true"
      ANNOUNCE_PLAYER_ACHIEVEMENTS: "true"
      SERVER_NAME: "paccao's server"
    volumes:
      - "./data-v2:/data:U"
      - ./modpacks:/modpacks:ro
      - ./backups:/backups:ro
