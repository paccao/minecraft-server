[settings]
minimum_release_age = "7d"

[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
ANSIBLE_CONFIG = "{{config_root}}/ansible/ansible.cfg"

[tools]
"aqua:google/yamlfmt" = "0.21.0"
python = "3.14"
uv = "0.12.17"
"pypi:black" = "26.5.1"
"pypi:ansible-core" = "2.21.4"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:getsops/sops" = "3.13.3"

[tasks.install-ansible-collections]
run = "ansible-galaxy collection install community.general containers.podman ansible.posix"

[tasks.bootstrap]
run = "age-keygen -o {{config_root}}/keys/pi5-alpine-1.agekey"

[tasks.format]
run = "yamlfmt **/*.yaml"

# mise generate git-pre-commit --write --task=pre-commit
[tasks.pre-commit]
run = { task = "format" }

[hooks]
postinstall = { task = "install-ansible-collections"}
