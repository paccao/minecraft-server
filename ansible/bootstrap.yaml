---
- name: Bootstrap Alpine server
  hosts: pi5-alpine-1
  gather_facts: false
  become_user: root
  become_method: doas
  vars_files:
    - vault.yaml.encrypted

  vars:
    minecraft_user: minecraft
    minecraft_user_pass: "{{ minecraft_user_password }}"

  tasks:
    - ansible.builtin.command: ssh-keyscan -t ed25519 pi5-alpine-1
      changed_when: false
      register: hostkey
      delegate_to: localhost
      tags: setup_known_hosts
      when: "'setup_known_hosts' in ansible_run_tags"

    - ansible.builtin.known_hosts:
        path: "{{ lookup('env', 'HOME') }}/.ssh/known_hosts"
        name: pi5-alpine-1
        key: "{{ hostkey.stdout }}"
      delegate_to: localhost
      tags: setup_known_hosts
      when: "'setup_known_hosts' in ansible_run_tags"

    - ansible.builtin.include_role:
        name: setup-ansible
        apply:
          become: true

    - name: Create mc-server admin user
      ansible.builtin.user:
        name: "{{ minecraft_user }}"
        password: "{{ minecraft_user_pass }}"
        state: present
        create_home: true
        shell: /bin/ash

    - ansible.builtin.include_role:
        name: setup-podman
        apply:
          become: true
