---
- name: Bootstrap Alpine server
  hosts: pi5-alpine-1
  gather_facts: false
  ansible_user: ansible
  become: false
  become_user: root
  become_method: doas
  vars_files:
    - vault.yaml.encrypted

  vars:
    admin_user: minecraft
    admin_password: "{{ minecraft_user_password }}"

  tasks:
    - ansible.builtin.role:
        name: setup-ansible
      become: true

    - name: Create mc-server admin user
      ansible.builtin.user:
        name: "{{ admin_user }}"
        state: present
        create_home: true
        shell: /bin/ash
      register: admin_created

    - name: Set password only if user was created
      ansible.builtin.shell: "echo {{ admin_user }}:{{ admin_password }} | chpasswd"
      when: admin_created.changed
      no_log: true

    - name: Harden sshd config
      raw: |
        sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
        sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
        grep -q '^PubkeyAuthentication ' /etc/ssh/sshd_config || echo 'PubkeyAuthentication yes' >> /etc/ssh/sshd_config
      changed_when: true

    - name: Restart sshd
      raw: |
        rc-service sshd restart
      changed_when: true
