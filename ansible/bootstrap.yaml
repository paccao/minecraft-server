---
- name: Bootstrap Alpine server
  hosts: pi5-alpine-1
  gather_facts: false
  become_user: root
  become_method: doas
  vars_files:
    - vault.yaml.encrypted

  # vars:
  #   admin_user: minecraft
  #   admin_password: "{{ minecraft_user_password }}"

  tasks:
    - ansible.builtin.command: ssh-keyscan -t ed25519 pi5-alpine-1
      register: hostkey
      changed_when: false
      delegate_to: localhost

    - ansible.builtin.known_hosts:
        path: "{{ lookup('env', 'HOME') }}/.ssh/known_hosts"
        name: pi5-alpine-1
        key: "{{ hostkey.stdout }}"
      delegate_to: localhost

    - ansible.builtin.include_role:
        name: setup-ansible
        apply:
          become: true

