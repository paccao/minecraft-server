- name: Ensure script directory exists
  ansible.builtin.file:
    path: /home/ansible/bin
    state: directory
    owner: ansible
    group: ansible
    mode: "0755"

- name: Copy restart script
  ansible.builtin.copy:
    src: "restart-minecraft-server.ash"
    dest: /home/ansible/bin/restart-minecraft-server.ash
    owner: ansible
    group: ansible
    mode: "0755"

- name: Install crontab for ansible user
  ansible.builtin.copy:
    dest: /etc/crontabs/ansible
    owner: root
    group: root
    mode: "0600"
    content: |
      0 3 * * * /home/ansible/bin/restart-minecraft-server.ash >> /home/ansible/restart-minecraft-server.log 2>&1
      30 15 * * 1-5 /home/ansible/bin/restart-minecraft-server.ash >> /home/ansible/restart-minecraft-server.log 2>&1
      0 12 * * 6,0 /home/ansible/bin/restart-minecraft-server.ash >> /home/ansible/restart-minecraft-server.log 2>&1
      30 18 * * 6,0 /home/ansible/bin/restart-minecraft-server.ash >> /home/ansible/restart-minecraft-server.log 2>&1

# Every day 03:00
# Monday to friday 15:30
# Saturday and sundays 12:00 and 18:30
