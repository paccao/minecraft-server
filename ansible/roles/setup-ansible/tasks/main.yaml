---
- name: Install base packages
  raw: |
    apk update
    apk add --no-cache python3 git rsync netbird cronie
  changed_when: true

- name: Enable and start netbird
  ansible.builtin.service:
    name: netbird
    enabled: true
    state: started

- name: Enable and start cron
  ansible.builtin.service:
    name: crond
    enabled: true
    state: started

- name: Create ansible user if missing
  ansible.builtin.user:
    name: "{{ future_ansible_user }}"
    password: "{{ future_ansible_user_password }}"
    state: present
    create_home: true
    shell: /bin/ash
    groups: wheel
    append: true

# - ansible.bultin.include_role:
#     name: setup-minecraft-user

- name: Create SSH directory
  ansible.builtin.file:
    state: directory
    owner: "{{ future_ansible_user }}"
    group: "{{ future_ansible_user }}"
    mode: "0700"
    path: "/home/{{ future_ansible_user }}/.ssh"

- name: Set up SSH key on remote
  ansible.posix.authorized_key:
    user: "{{ future_ansible_user }}"
    state: present
    key: "{{ lookup('file', playbook_dir ~ '/keys/pi5-alpine-1.pub') }}"

- name: copy ash config files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ remote_home }}/"
    owner: "{{ future_ansible_user }}"
    group: "{{ future_ansible_user }}"
    mode: 0644
  loop:
    - ".ashrc"
    - ".profile"
